name: generate stats cards

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: clone github-readme-stats
        run: git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git "$RUNNER_TEMP/grs"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: start github-readme-stats locally
        working-directory: ${{ runner.temp }}/grs
        env:
          PAT_1: ${{ secrets.STATS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          nohup node express.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null "http://localhost:9000/api?username=${{ github.repository_owner }}" && break
            sleep 2
          done

      - name: render cards
        run: |
          mkdir -p stats
          U="${{ github.repository_owner }}"
          curl -sf "http://localhost:9000/api?username=$U&show_icons=false&line_height=30&rank_icon=github&theme=tokyonight&hide_border=true&text_color=e8df7a" -o stats/stats.svg
          curl -sf "http://localhost:9000/api/top-langs/?username=$U&theme=tokyonight&hide_border=true&layout=donut&custom_title=Abhiram's%20Most%20Used%20Languages&text_color=e8df7a" -o stats/top-langs.svg
          ! grep -q "Something went wrong" stats/*.svg

      - name: commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats
          git diff --cached --quiet || git commit -m "chore: update stats cards" && git push
